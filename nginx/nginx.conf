# ==========================================================================
# KTU UNIVERSITY RESULT APPLICATION — NGINX LOAD BALANCER & REVERSE PROXY
# Tuned for 100,000+ Concurrent Students with Rate Limiting & Gzip/Brotli
# ==========================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # Rate Limiting Zones (Spike Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=burst_limit:20m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:20m;

    # Upstream Stateless API Cluster (Horizontal Scaling)
    upstream ktu_api_cluster {
        least_conn; # Route to least loaded instance
        server api-1:8000 max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
        server api-3:8000 max_fails=3 fail_timeout=10s;
        keepalive 128; # Maintain persistent connection pool
    }

    server {
        listen 80;
        server_name _;

        # Client Body / Upload Buffer
        client_max_body_size 50M;
        client_body_buffer_size 128k;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static Asset Delivery with Browser Caching
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2)$ {
            proxy_pass http://ktu_api_cluster;
            proxy_set_header Host $host;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, no-transform, max-age=2592000";
        }

        # Rate-Limited Result API Endpoint
        location /api/v1/results {
            limit_req zone=api_limit burst=15 nodelay;
            limit_conn addr_limit 30;

            proxy_pass http://ktu_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fast timeouts to prevent worker starvation
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        # General Proxy Rule
        location / {
            proxy_pass http://ktu_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Prometheus Metrics Route (Internal / Orchestrator only)
        location /metrics {
            proxy_pass http://ktu_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
